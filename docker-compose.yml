version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: ncba-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: payment_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5


  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: ncba-payments
    environment:
      DB_HOST: mysql
      DB_NAME: payment_db
      DB_USER: root
      DB_PASS: root
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: ncba-notification
    environment:
      DB_HOST: mysql
      DB_NAME: notification_db
      DB_USER: root
      DB_PASS: root
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy

  reporting-service:
    build:
      context: .
      dockerfile: reporting-service/Dockerfile
    container_name: ncba-reporting
    environment:
      DB_HOST: mysql
      DB_NAME: reporting_db
      DB_USER: root
      DB_PASS: root
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
   mysql_data: