# ── NOTIFICATION SERVICE ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ncba
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: ncba/notification-service:latest
          ports:
            - containerPort: 8081
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: ncba-config
                  key: DB_HOST
            - name: DB_NAME
              value: notification_db
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: ncba-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ncba-secrets
                  key: DB_PASSWORD
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: ncba
spec:
  selector:
    app: notification-service
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP
---
